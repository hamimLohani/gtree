version: 2

project_name: gtree

before:
  hooks:
    - go mod tidy

builds:
  - id: gtree
    main: .
    binary: gtree
    ldflags:
      - -s -w
      - -X github.com/hamimlohani/gtree/cmd.Version={{.Version}}
      - -X github.com/hamimlohani/gtree/cmd.BuildDate={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    format: binary   # just the bare binary, no tarball for now
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: hamimlohani
    name: gtree
  draft: false
  prerelease: auto
  name_template: "gtree {{.Version}}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "typo"
